<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redemittel 100</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        /* 회화 패턴 테마: Emerald (Green) */
                        emerald: { 
                            50: '#ecfdf5', 
                            100: '#d1fae5', 
                            400: '#34d399',
                            500: '#10b981', 
                            600: '#059669', 
                            900: '#064e3b' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* 기존과 동일한 유리 효과 디자인 */
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.6); }
        
        /* 사이드 메뉴 스타일 */
        .side-nav { position: fixed; left: 2rem; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1.5rem; z-index: 40; }
        .side-btn { position: relative; width: 3.5rem; height: 3.5rem; background: white; border: 1px solid #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #64748b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .side-btn:hover { background: #059669; color: white; border-color: #059669; transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }
        .side-tooltip { position: absolute; left: 100%; top: 50%; transform: translateY(-50%) translateX(10px); background: #1e293b; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; white-space: nowrap; opacity: 0; visibility: hidden; transition: all 0.2s ease; pointer-events: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .side-tooltip::before { content: ''; position: absolute; left: -4px; top: 50%; transform: translateY(-50%); border-width: 4px; border-style: solid; border-color: transparent #1e293b transparent transparent; }
        .side-btn:hover .side-tooltip { opacity: 1; visibility: visible; transform: translateY(-50%) translateX(15px); }
        
        .nav-link { color: #64748b; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: #059669; }
        .nav-link.active { color: #059669; font-weight: 700; }
        
        @media (max-width: 1350px) { .side-nav { display: none; } }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-emerald-100 selection:text-emerald-900">

   <div class="side-nav">
        <div onclick="document.getElementById('list-start').scrollIntoView()" class="side-btn group">
            <i class="ph-bold ph-list-dashes text-xl"></i>
            <div class="side-tooltip">패턴 리스트</div>
        </div>
        <div onclick="document.getElementById('quiz-start').scrollIntoView()" class="side-btn group">
            <i class="ph-bold ph-pencil-simple text-xl"></i>
            <div class="side-tooltip">실전 퀴즈</div>
        </div>
        <div onclick="window.scrollTo(0,0)" class="side-btn group">
            <i class="ph-bold ph-arrow-up text-xl"></i>
            <div class="side-tooltip">맨 위로</div>
        </div>
    </div>

    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='../index.html'">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                        <span class="font-bold text-lg">D</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl tracking-tight text-slate-900 leading-none">Deutsch Lernen</h1>
                        <span class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Redemittel Theme</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-8 text-sm">
                    <a href="../index.html" class="nav-link">Alle</a>
                    <a href="../a1.html" class="nav-link">A1</a>
                    <a href="../a2.html" class="nav-link">A2</a>
                    <a href="grammatik.html" class="nav-link active">Grammatik</a> 
                    <a href="../notification.html" class="nav-link">Notification</a>
                </div>
                <div></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            
            <div id="list-start" class="scroll-mt-32">
                <div class="text-center mb-12">
                    <span class="inline-block px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold mb-3 border border-emerald-100">
                        <i class="ph-bold ph-chats-teardrop"></i> Communication
                    </span>
                    <h2 class="text-3xl lg:text-4xl font-bold text-slate-900 mb-4">Redemittel 100</h2>
                    <p class="text-slate-500 mb-8 max-w-2xl mx-auto">
                        단어만 갈아 끼우면 수천 개의 문장이 되는 마법의 패턴들입니다.<br>
                        하루에 5개씩 <span class="text-emerald-600 font-bold">나만의 문장</span>을 만들어보세요.
                    </p>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4" id="word-list-container">
                    </div>
            </div>

            <section id="quiz-start" class="mt-40 mb-20 scroll-mt-32">
                <div class="max-w-3xl mx-auto">
                    <div class="text-center mb-10">
                        <span class="text-emerald-600 font-bold tracking-widest text-xs uppercase mb-2 block">Challenge</span>
                        <h3 class="text-3xl font-bold text-slate-900">Pattern Quiz</h3>
                    </div>

                    <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden relative">
                        <div class="absolute -top-20 -right-20 w-64 h-64 bg-emerald-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
                        
                        <div id="q-init" class="p-16 text-center relative z-10">
                            <div class="w-20 h-20 bg-emerald-50 rounded-2xl flex items-center justify-center mx-auto mb-6 text-emerald-600">
                                <i class="ph-duotone ph-translate text-4xl"></i>
                            </div>
                            <h4 class="text-xl font-bold text-slate-900 mb-6">패턴 마스터 퀴즈</h4>
                            <p class="text-slate-500 mb-8">한국어 뜻을 보고 적절한 독일어 패턴을 선택하세요.</p>
                            <button onclick="startQuiz()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-10 py-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all transform hover:-translate-y-1">
                                퀴즈 시작하기
                            </button>
                        </div>

                        <div id="q-play" class="p-8 md:p-12 hidden relative z-10">
                            <div class="flex justify-between items-center mb-8">
                                <div id="q-status" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">Q. 1 / 10</div>
                                <div class="w-24 h-2 bg-slate-100 rounded-full"><div id="q-progress-bar" class="h-full bg-emerald-500 w-0 transition-all duration-300"></div></div>
                            </div>
                            <div class="text-center mb-8">
                                <h4 id="q-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-snug"></h4>
                            </div>
                            <div id="q-options" class="grid grid-cols-1 gap-3 mb-8"></div>
                            <button id="next-btn" onclick="nextQ()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-800 transition-all" disabled>
                                다음 문제 <i class="ph-bold ph-arrow-right ml-2 inline-block align-middle"></i>
                            </button>
                        </div>

                        <div id="q-result" class="p-16 text-center hidden relative z-10">
                            <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6 text-emerald-500 text-5xl">
                                <i class="ph-fill ph-trophy"></i>
                            </div>
                            <h4 class="text-lg font-medium text-slate-500 mb-2">당신의 점수는?</h4>
                            <h4 class="text-5xl font-black text-slate-900 mb-8 tracking-tight" id="score-text"></h4>
                            <button onclick="location.reload()" class="bg-white border-2 border-slate-200 text-slate-700 hover:border-emerald-500 hover:text-emerald-600 px-8 py-3 rounded-xl font-bold transition-all">
                                <i class="ph-bold ph-arrows-clockwise mr-2"></i> 다시 도전
                            </button>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

<div id="pattern-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onclick="closePatternModal()">
        <div class="absolute inset-0 transition-opacity"></div>
        <div class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl p-10 transform transition-all scale-100 text-center" onclick="event.stopPropagation()">
            <button class="absolute top-6 right-6 text-slate-300 hover:text-slate-600 transition-colors" onclick="closePatternModal()">
                <i class="ph-bold ph-x text-2xl"></i>
            </button>
            <div class="inline-block px-3 py-1 rounded-lg text-xs font-bold mb-4 uppercase tracking-wider bg-emerald-50 text-emerald-600">
                Pattern
            </div>
            
            <h3 id="modal-pattern" class="text-3xl font-bold text-slate-900 mb-2 leading-tight"></h3>
            <p id="modal-meaning" class="text-lg font-medium text-emerald-600 mb-8"></p>
            
            <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 text-left">
                <span class="text-xs font-bold text-emerald-800 uppercase mb-2 block tracking-wider">Beispiel (예문)</span>
                <p id="modal-sentence" class="text-xl font-bold text-slate-800 mb-2"></p>
                <p id="modal-trans" class="text-sm text-slate-500"></p>
            </div>
            
        </div>
    </div>

    <script src="../js/redemittel_100_data.js"></script> 
    <script src="../app/redemittel_100_app.js"></script>
</body>
</html>
